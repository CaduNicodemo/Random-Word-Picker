<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Word Picker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="header-logos">
            <img class="logo-rb" src="./Logo-Header.png" alt="Red Balloon Logo">
            <h1 id="header-title">Random Word Picker</h1>
            <br></br>
            <div class="menu-grid">
                <button class="menu-btn spelling-bee-btn list1" onclick="goToMenu('spelling-bee-1')">Spelling Bee List 1</button>
                <button class="menu-btn spelling-bee-btn list2" onclick="goToMenu('spelling-bee-2')">Spelling Bee List 2</button>
                <button class="menu-btn spelling-bee-btn list3" onclick="goToMenu('spelling-bee-3')">Spelling Bee List 3</button>
                <button class="menu-btn spelling-bee-btn list4" onclick="goToMenu('spelling-bee-4')">Spelling Bee List 4</button>
                <button class="menu-btn cambridge-week-btn" onclick="goToMenu('cambridge-week')">Cambridge Week</button>
            </div>
        </div>
    </header>

    <!-- HOME PAGE -->
    <div id="home-page" class="page-container">
        <div class="home-content">
            <div class="picker-section">
            <p class="instruction">Paste your comma-separated words below:</p>
            <textarea id="wordInput" placeholder="apple, banana, cherry, dragonfruit..."></textarea>
            
            <div class="controls">
                <button class="btn-pick" onclick="pickWord()">Pick a Word</button>
                <button class="btn-reset" onclick="resetPool()">Reset List</button>
            </div>

            <div id="result-container">
                <div id="result">...</div>
                <div id="counter">Words remaining in pool: 0</div>
            </div>
        </div>

        <div class="history-section">
            <h3>Picked List</h3>
            <ul id="pickedList"></ul>
        </div>
        </div>
    </div>

    <!-- MENU PAGE (Level Selection) -->
    <div id="menu-page" class="page-container" style="display: none;">
        <div class="menu-content">
            <h2 id="menu-title">Select a Level</h2>
            <div class="level-buttons" id="level-buttons-container">
                <!-- Dynamically populated -->
            </div>
            <button class="btn-back" onclick="goHome()">← Back to Home</button>
        </div>
    </div>

    <!-- PRACTICE TYPE PAGE (Practice 1, Practice 2, Championship) -->
    <div id="practice-type-page" class="page-container" style="display: none;">
        <div class="menu-content">
            <h2 id="practice-type-title">Select Practice Type</h2>
            <div class="practice-type-buttons" id="practice-type-container">
                <!-- Dynamically populated with Practice 1, Practice 2, Championship -->
            </div>
            <button class="btn-back" onclick="goToMenu(currentMenu)">← Back to Levels</button>
        </div>
    </div>

    <!-- PRACTICE PAGE (Word Picker) -->
    <div id="practice-page" class="page-container" style="display: none;">
        <div class="main-container">
            <div class="picker-section">
                <p class="instruction">Paste your comma-separated words below:</p>
                <textarea id="practiceWordInput" placeholder="apple, banana, cherry, dragonfruit..."></textarea>
                
                <div class="controls">
                    <button class="btn-pick" onclick="pickWord()">Pick a Word</button>
                    <button class="btn-reset" onclick="resetPool()">Reset List</button>
                </div>

                <div id="result-container">
                    <div id="practiceResult">...</div>
                    <div id="practiceCounter">Words remaining in pool: 0</div>
                </div>
            </div>

            <div class="history-section">
                <h3>Picked List</h3>
                <ul id="practicePickedList"></ul>
            </div>
        </div>

        <div class="practice-nav">
            <button class="btn-back" id="practice-back-btn" onclick="goBackFromPractice()">← Back</button>
        </div>
    </div>

    <script>
        // ===== STATE MANAGEMENT =====
        let currentPage = 'home';
        let currentMenu = null;
        let currentLevel = null;
        let wordPool = [];
        let pickedWords = [];

        // ===== WORD LISTS DATA =====
        // Keep only cambridge-week embedded; spelling-bee lists will be loaded from questions_spelling.json
        const wordDatabase = {
            'cambridge-week': {
                name: 'Cambridge Week',
                levels: {
                    'J1-J2': 'Big Ben, Cambridge, England, football, guards, island, king, London, marmalade, queen, rain, Shakespeare, tea, underground, Victoria, Wales, Yorkshire, Hogwarts, royalty',
                    'TA-T2': 'Big Ben, Cambridge, crown, England, football, fish and chips, guards, island, king, London, marmalade, queen, rain, royal, rugby, Shakespeare, tea, underground, Victoria',
                    'T3-T6': 'flat, lift, lorry, biscuit, chips, crisps, holidays, queue, torch, rubber, football, trousers, petrol, chemist, postman, tube, zebra crossing, timetable, garden'
                }
            }
        };

        // Load questions_spelling.json and replace embedded lists with its contents (Option B)
        (async function loadSpellingJSON() {
            try {
                const resp = await fetch('questions_spelling.json', {cache: 'no-store'});
                if (resp.ok) {
                    const data = await resp.json();
                    // Replace or add menus from JSON — this fully replaces embedded spelling lists
                    Object.keys(data).forEach(k => {
                        wordDatabase[k] = data[k];
                    });
                    console.log('Loaded questions_spelling.json and replaced embedded spelling lists.');
                } else {
                    console.log('questions_spelling.json not found; using embedded lists where present.');
                }
            } catch (e) {
                console.warn('Failed to load questions_spelling.json:', e);
            }
            // After loading JSON, generate Championship lists
            if (typeof generateChampionshipLists === 'function') generateChampionshipLists();
        })();

        // ===== GENERATE CHAMPIONSHIP LISTS FROM PRACTICE 1 & 2 =====
        function generateChampionshipLists() {
            Object.keys(wordDatabase).forEach(menuId => {
                const menu = wordDatabase[menuId];
                if (menu.levels) {
                    Object.keys(menu.levels).forEach(level => {
                        const levelData = menu.levels[level];
                        if (typeof levelData === 'object' && levelData['Practice 1'] && levelData['Practice 2']) {
                            // Only generate if Championship is empty or contains a placeholder
                            if (!levelData['Championship'] || levelData['Championship'].trim() === '' || levelData['Championship'].includes("Sorry")) {
                                levelData['Championship'] = (levelData['Practice 1'] + ', ' + levelData['Practice 2']).replace(/,\s+,/g, ',').replace(/,\s*$/g, '');
                            }
                        }
                    });
                }
            });
        }
        // NOTE: generateChampionshipLists() will be called after attempting to load the JSON above.

        // ===== AJUDA PARA IDENTIFICAR ELEMENTOS ATUAIS =====
function getActiveElements() {
    // Se estivermos na página de prática, usa os IDs com o prefixo 'practice'
    if (currentPage === 'practice') {
        return {
            input: document.getElementById('practiceWordInput'),
            result: document.getElementById('practiceResult'),
            counter: document.getElementById('practiceCounter'),
            list: document.getElementById('practicePickedList')
        };
    } 
    // Caso contrário, usa os IDs da Home
    return {
        input: document.getElementById('wordInput'),
        result: document.getElementById('result'),
        counter: document.getElementById('counter'),
        list: document.getElementById('pickedList')
    };
}

// ===== WORD PICKER LOGIC =====
function initializePool() {
    const els = getActiveElements();
    const rawText = els.input.value;
    
    if (!rawText.trim()) {
        wordPool = [];
        updateUI();
        return false;
    }
    
    wordPool = rawText.split(',').map(word => word.trim()).filter(word => word.length > 0);
    pickedWords = []; 
    updateUI();
    return true;
}

function pickWord() {
    const els = getActiveElements();
    
    if (wordPool.length === 0) {
        if (pickedWords.length > 0) {
             els.result.innerHTML = "<span style='color: var(--rb-text-sub); font-size: 18px;'>All words picked! Press Reset to reload.</span>";
             return;
        }
        const loaded = initializePool();
        if (!loaded) return;
    }
 
    const randomIndex = Math.floor(Math.random() * wordPool.length);
    const selectedWord = wordPool.splice(randomIndex, 1)[0];
    
    pickedWords.push(selectedWord);
    els.result.innerText = selectedWord;
    updateUI();
}

function resetPool() {
    if(initializePool()){
        const els = getActiveElements();
        els.result.innerText = "...";
    }
}

function updateUI() {
    const els = getActiveElements();
    els.counter.innerText = `Words remaining in pool: ${wordPool.length}`;
    
    els.list.innerHTML = ''; 
    for (let i = pickedWords.length - 1; i >= 0; i--) {
        const li = document.createElement('li');
        li.innerText = pickedWords[i];
        els.list.appendChild(li);
    }
}

// ===== NAVEGAÇÃO (Mantendo o que já funcionava) =====
function showPage(pageName) {
    currentPage = pageName; // Atualiza a variável global de controle
    document.getElementById('home-page').style.display = (pageName === 'home') ? 'block' : 'none';
    document.getElementById('menu-page').style.display = (pageName === 'menu') ? 'block' : 'none';
    document.getElementById('practice-type-page').style.display = (pageName === 'practice-type') ? 'block' : 'none';
    document.getElementById('practice-page').style.display = (pageName === 'practice') ? 'block' : 'none';
}

        function goHome() {
            showPage('home');
        }

        function goToMenu(menuId) {
            currentMenu = menuId;
            const menuData = wordDatabase[menuId];
            document.getElementById('menu-title').textContent = `${menuData.name} - Select a Level`;

            // Generate level buttons
            const container = document.getElementById('level-buttons-container');
            container.innerHTML = '';

            for (const level in menuData.levels) {
                const btn = document.createElement('button');
                btn.className = 'level-btn';
                btn.textContent = level;
                btn.id = `level-${level.toLowerCase().replace(/\s+/g, '-')}`;
                btn.onclick = () => (menuId === 'cambridge-week') ? goToPractice(menuId, level, null) : goToPracticeType(menuId, level);
                container.appendChild(btn);
        }
        showPage('menu');
    }
    function goToPracticeType(menuId, level) {
        currentLevel = level;
        const container = document.getElementById('practice-type-container');
        container.innerHTML = '';
        ['Practice 1', 'Practice 2', 'Championship'].forEach(type => {
        const btn = document.createElement('button');
            btn.className = 'level-btn';
            btn.textContent = type;
            btn.id = `practice-${type.toLowerCase().replace(/\s+/g, '-')}`;
            btn.onclick = () => goToPractice(menuId, level, type);
            container.appendChild(btn);
        });
        showPage('practice-type');
    }
        function goToPractice(menuId, level, type) {
        currentMenu = menuId;
        const words = type ? wordDatabase[menuId].levels[level][type] : wordDatabase[menuId].levels[level];
        
        showPage('practice');
        // Agora usamos getActiveElements para garantir que vamos escrever no textarea correto
        const els = getActiveElements();
        els.input.value = words;
        wordPool = [];
        pickedWords = [];
        els.result.innerText = '...';
        updateUI();
    }
function goBackFromPractice() {
        (currentMenu === 'cambridge-week') ? goToMenu(currentMenu) : goToPracticeType(currentMenu, currentLevel);
    };
</script>
</body>
</html>
